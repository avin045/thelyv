# Runs on every push and pull request: the plugin manifests must be valid
# and every manifest must carry the same version.
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Same version in every manifest
        run: node scripts/check-versions.mjs
      - name: Validate the Claude plugin
        run: npx --yes @anthropic-ai/claude-code@2.1.318 plugin validate .
